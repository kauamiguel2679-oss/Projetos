<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 8</title>
</head>

<body>
    <h1>Exercício 8</h1>
    <form action="Cadastro.html" method="post">
        <label for="nome">Nome: </label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
        <br><br>
        <label for="data">Data de Nascimento: </label>
        <input type="date" required>
        <br><br>
        <label for="email">Email: </label>
        <input type="email" id="email" name="email" placeholder="Digite um email">
        <br><br>
        <label for="senha">Senha: </label>
        <input type="password" id="senha" placeholder="Digite sua senha" name="senha" required>
        <br><br>
        <label for="telefone">Telefone: </label>
        <input type="tel" pattern="[0-9]{2}\s?[0-9]{4}-?[0-9{4}]" name="telefone" placeholder="Digite seu telefone">

        <button type="submit">Enviar</button>

    </form>
</body>

</html>
