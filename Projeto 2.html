<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de CSS</title>
    <link rel="stylesheet" href="Projeto 2.css">
</head>

<body>
    <div>
        <a href="new conteudo.html" class="button2">Voltar</a>
    </div>
    <br><br>
    <h1>
        <span class="azul">SENA</span><span class="laranja">I</span>
    </h1>
    <hr>
    <h2>Cadastro de cursos</h2>
    <form action="Cadastro.html" method="post">
        <label for="nome">Nome: </label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        <hr>
        <br>
        <label for="matricula">Matrícula:</label>
        <input type="text" id="matricula" name="matricula">
        <hr>
        <br>
        <label for="data-de-nascimento">Data de nascimento: </label>
        <input type="date" required>
        <hr>
        <h4>Cursos</h4>
        <select name="selecionar-cursos" id="selecionar-cursos">
            <option value="informatica">Informatica</option>
            <option value="cofeitaria">Cofeitaria</option>
            <option value="mecanica">Mecanica</option>
            <option value="quimica">Quimica</option>
        </select>
        <br><br>
        <textarea name="observacoes" id="observacoes"></textarea>
        <hr>
        <br>
        <div class="button3">
            <button type="submit">Enviar</button>
        </div>
        <br><br><br>
        <footer>
            <h4>Para mais informações:</h4>
            <p>Acesse o nosso site oficial</p>
            <a href="https://www.senai.portaldaindustria.com.br/para-voce" target="_blank">SENAI</a>
        </footer>
    </form>

</body>

</html>
