<body>

   <h1>Exercício 1</h1>
   <form action="Cadastro.html" method="post">

      <button type="submit">Enviar</button>
   </form>

   <br>
</body>

<body>
   <h1>Exercício 2</h1>
   <form action="Cadastro.html" method="post">

      <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

      <textarea name="observacoes" id="observacoes"></textarea>
      <br>
      <button type="submit">Enviar</button>
   </form>
   <hr>
   <br>
   <h1>Exercício 3</h1>
   <form action="Cadastro.html" method="post">
      <label for="nome">Nome: </label>
      <input type="text" name="nome" placeholder="Digite seu nome" required>
      <br>
      <label for="turnos">Turnos: </label>
      <select name="turnos" id="turnos">
         <option value="manha">Manhã</option>
         <option value="tarde">Tarde</option>
         <option value="noite">Noite</option>
      </select>
      <br>
      <input type="checkbox" id="html" name="tecnologias" value="html">
      <label for="html">
         HTML
      </label>
      <br>
      <input type="checkbox" id="css" name="tecnologias" value="css">
      <label for="css">
         CSS
      </label>
      <br>
      <input type="checkbox" id="javascript" name="tecnologias" value="javascript">
      <label for="javascript">
         JavaScript
      </label>
   </form>
